<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finishing Google sign-in - Aevora</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101627; color: #fff; }
      main { padding: 36px 24px; max-width: 360px; text-align: center; }
      .spinner { width: 32px; height: 32px; border: 3px solid #4a5874; border-top-color: #7c9bff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
      p { color: #c1c9dc; line-height: 1.6; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="title">Finishing sign-in...</h2>
      <p id="message">Aevora is verifying your Google account.</p>
    </main>
    <script src="/google-auth-complete.js"></script>
  </body>
</html>
